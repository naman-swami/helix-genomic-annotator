name: Clinical Genomics Pipeline CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate VCF Reference Data
        run: |
          python -c "from parsers.vcf_parser import VCFParser; recs = VCFParser.parse_file('data/reference/clinvar_sample.vcf'); assert len(recs) >= 3; print(f'Validated {len(recs)} VCF records.')"
      - name: Run ACMG Pathogenicity Unit Tests
        run: pytest tests/ -v
      - name: Validate OpenGAP 0.1.0 Manifest
        run: |
          python -c "import yaml; d=yaml.safe_load(open('agent.yaml')); assert d['spec_version']=='0.1.0' and len(d)==5; print('OpenGAP Spec Validated')"
