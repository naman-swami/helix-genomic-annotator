annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Evaluate the 28 ACMG/AMP rules to assign Pathogenic, Likely Pathogenic,
  or VUS classification.
input_schema:
  additionalProperties: false
  properties:
    evidence_codes:
      type: string
    variant_id:
      type: string
  required:
  - variant_id
  - evidence_codes
  type: object
name: compute-acmg-matrix
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
