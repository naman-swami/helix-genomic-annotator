annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Retrieve population minor allele frequencies (MAF) for specified genomic
  coordinates.
input_schema:
  additionalProperties: false
  properties:
    genome_build:
      type: string
    hgvs_notation:
      type: string
  required:
  - hgvs_notation
  type: object
name: query-gnomad-frequencies
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
